name: 🚀 HaruDrive Cloud Mirror (GDrive to HuggingFace)

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'Google Drive File / Folder URL or ID'
        required: true
        type: string
      target_path:
        description: 'Target Path in Hugging Face (e.g., Movies/2026 or leave empty for root)'
        required: false
        default: ''
        type: string
      hf_repo:
        description: 'Hugging Face Dataset (e.g., username/repo_name, leave empty to use Secret)'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [gdrive_mirror]

jobs:
  mirror:
    runs-on: ubuntu-latest
    name: Cloud Mirror Runner
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub gdown tqdm

      - name: ⚡ Execute Mirror Sync
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ github.event.inputs.hf_repo || github.event.client_payload.hf_repo || secrets.HF_REPO_ID }}
          GDRIVE_URL: ${{ github.event.inputs.gdrive_url || github.event.client_payload.gdrive_url }}
          TARGET_PATH: ${{ github.event.inputs.target_path || github.event.client_payload.target_path || '' }}
          REPO_TYPE: 'dataset'
        run: |
          python scripts/mirror.py
