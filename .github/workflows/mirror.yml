name: 🌸 HaruDrive Cloud Mirror (GDrive to HuggingFace)

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'Google Drive or Gofile File / Folder URL or ID'
        required: true
        type: string
      folder_name:
        description: 'Custom container folder name (optional, overrides auto folder - useful for Gofile guest IDs)'
        required: false
        default: ''
        type: string
      target_path:
        description: 'Target Path in Hugging Face (e.g., Movies/2026 or leave empty for root)'
        required: false
        default: ''
        type: string
      hf_repo:
        description: 'Hugging Face Dataset (e.g., username/repo_name, leave empty to use Secret)'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [gdrive_mirror]

jobs:
  mirror:
    runs-on: ubuntu-latest
    name: Cloud Mirror Runner
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub gdown tqdm requests

      - name: ⚡ Execute Mirror Sync
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ github.event.inputs.hf_repo || github.event.client_payload.hf_repo || secrets.HF_REPO_ID || '' }}
          GDRIVE_URL: ${{ github.event.inputs.gdrive_url || github.event.client_payload.gdrive_url }}
          FOLDER_NAME: ${{ github.event.inputs.folder_name || github.event.client_payload.folder_name || '' }}
          GOFILE_API_TOKEN: ${{ secrets.GOFILE_API_TOKEN }}
          TARGET_PATH: ${{ github.event.inputs.target_path || github.event.client_payload.target_path || '' }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          REPO_TYPE: 'dataset'
        run: |
          python scripts/mirror.py
